import net.darkhax.curseforgegradle.TaskPublishCurseForge

import java.util.regex.Pattern

plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id "com.modrinth.minotaur" version "2.+"
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
    }

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.fuzs_version}"

    modImplementation("dev.xylonity.knightlib:knightlib-fabric-${minecraft_version}:1.5.0")

    modImplementation("software.bernie.geckolib:geckolib-fabric-${minecraft_version}:4.4.7")
    modImplementation "com.terraformersmc:modmenu:7.2.2"

    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.0"

    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

def extractChangelogForVersion = { File file, String version ->
    if (!file || !file.exists()) {
        return null
    }

    def lines = file.getText('UTF-8').readLines()
    if (lines.isEmpty()) return null
    lines[0] = lines[0].replaceFirst('^\\uFEFF', '')

    def lead = '^\\s*#{1,6}\\s*'
    def ver  = Pattern.quote(version)

    def headerPattern = Pattern.compile(lead + '[vV]?' + ver + '\\b.*\\s*$')
    def nextHeaderPattern = Pattern.compile(lead + '[vV]?\\d+\\.\\d+(?:\\.\\d+)?(?:[-+][\\w.]+)?\\b.*\\s*$')

    int start = -1
    for (int i = 0; i < lines.size(); i++) {
        if (headerPattern.matcher(lines[i]).matches()) { start = i + 1; break }
    }

    if (start == -1) {
        return null
    }

    def collected = []
    for (int j = start; j < lines.size(); j++) {
        def line = lines[j]
        if (nextHeaderPattern.matcher(line).matches()) {
            break
        }

        collected << line
    }

    while (!collected.isEmpty() && collected[0].trim().isEmpty()) {
        collected.remove(0)
    }

    while (!collected.isEmpty() && collected[collected.size()-1].trim().isEmpty()) {
        collected.remove(collected.size()-1)
    }

    return collected.isEmpty() ? null : collected.join(System.lineSeparator())
}

def changelogSection = extractChangelogForVersion(project.file('../CHANGELOG.md'), project.property('version').toString())

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = 'publishing'
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    def mainFile = upload("1016595", remapJar)

    mainFile.displayName = "[FABRIC] Knight Quest " + project.property('version').toString() + "-" + minecraft_version

    mainFile.addEnvironment("Client")
    mainFile.addEnvironment("Server")
    mainFile.addModLoader("Fabric")
    mainFile.addGameVersion("1.20")
    mainFile.addGameVersion("1.20.1")

    mainFile.releaseType = "release"

    mainFile.changelog = changelogSection
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "knight-quest"

    versionName = "[FABRIC] Knight Quest " + project.property('version').toString() + "-" + minecraft_version

    loaders = ["fabric"]
    gameVersions = ["1.20", "1.20.1"]

    uploadFile = remapJar
    versionNumber = project.property('version').toString()
    versionType = "release"

    changelog = changelogSection
}
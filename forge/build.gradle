import net.darkhax.curseforgegradle.TaskPublishCurseForge

import java.util.regex.Pattern

plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id "com.modrinth.minotaur" version "2.+"
}
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

minecraft {
    mappings("parchment", "2023.09.03-1.20.1")

    copyIdeResources = true

    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(":common")

    implementation fg.deobf("dev.xylonity.knightlib:knightlib-forge-${minecraft_version}:1.4.0")

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:4.4.7")

    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    implementation fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            fg.component(it)
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

def extractChangelogForVersion = { File file, String version ->
    if (!file || !file.exists()) {
        return null
    }

    def lines = file.getText('UTF-8').readLines()
    if (lines.isEmpty()) return null
    lines[0] = lines[0].replaceFirst('^\\uFEFF', '')

    def lead = '^\\s*#{1,6}\\s*'
    def ver  = Pattern.quote(version)

    def headerPattern = Pattern.compile(lead + '[vV]?' + ver + '\\b.*\\s*$')
    def nextHeaderPattern = Pattern.compile(lead + '[vV]?\\d+\\.\\d+(?:\\.\\d+)?(?:[-+][\\w.]+)?\\b.*\\s*$')

    int start = -1
    for (int i = 0; i < lines.size(); i++) {
        if (headerPattern.matcher(lines[i]).matches()) { start = i + 1; break }
    }

    if (start == -1) {
        return null
    }

    def collected = []
    for (int j = start; j < lines.size(); j++) {
        def line = lines[j]
        if (nextHeaderPattern.matcher(line).matches()) {
            break
        }

        collected << line
    }

    while (!collected.isEmpty() && collected[0].trim().isEmpty()) {
        collected.remove(0)
    }

    while (!collected.isEmpty() && collected[collected.size()-1].trim().isEmpty()) {
        collected.remove(collected.size()-1)
    }

    return collected.isEmpty() ? null : collected.join(System.lineSeparator())
}

def changelogSection = extractChangelogForVersion(project.file('../CHANGELOG.md'), project.property('version').toString())

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    group = 'publishing'
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    def mainFile = upload("1018043", jar)

    mainFile.displayName = "[FORGE] Knight Quest " + project.property('version').toString() + "-" + minecraft_version

    mainFile.addEnvironment("Client")
    mainFile.addEnvironment("Server")
    mainFile.addModLoader("Forge")
    mainFile.addGameVersion("1.20")
    mainFile.addGameVersion("1.20.1")

    mainFile.releaseType = "release"

    mainFile.changelog = changelogSection
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "knight-quest"

    versionName = "[FORGE] Knight Quest " + project.property('version').toString() + "-" + minecraft_version

    loaders = ["forge"]
    gameVersions = ["1.20", "1.20.1"]

    uploadFile = jar
    versionNumber = project.property('version').toString()
    versionType = "release"

    changelog = changelogSection
}